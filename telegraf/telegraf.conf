[agent]
  interval = "30s"
  flush_interval = "30s"        # schneller flush
  metric_batch_size = 1000
  metric_buffer_limit = 200000  # größerer Buffer
  omit_hostname = true

# ============================
# INPUT: IONIQ 5 (MY22)
# ============================
[[inputs.tail]]
  # CSVs des alten Ioniq 5 (MY22)
  files = ["/etc/telegraf/obd_logs/processing/my22/*.csv"]
  from_beginning = true
  watch_method = "poll"
  data_format = "csv"
  name_override = "carscanner"
  csv_header_row_count = 1
  csv_trim_space = true

  # Tags für das MY 22
  [inputs.tail.tags]
    car       = "Ioniq5_MY22"
	ownership = "privatfahrzeug"    

# ============================
# INPUT: IONIQ 5 (MY25)
# ============================
[[inputs.tail]]
  # CSVs des neuen Ioniq 5 Facelift (MY25)
  files = ["/etc/telegraf/obd_logs/processing/my25/*.csv"]
  from_beginning = true
  watch_method = "poll"
  data_format = "csv"
  name_override = "carscanner"
  csv_header_row_count = 1
  csv_trim_space = true

  # Tags für das neue Auto
  [inputs.tail.tags]
    car       = "Ioniq5_MY25"
    ownership = "dienstwagen"

# ============================
# PROCESSORS
# ============================

[[processors.rename]]
  [[processors.rename.replace]]
    field = "Longtitude"
    dest  = "Longitude"
	
  [[processors.rename.replace]]
    field = "time"
    dest  = "recordtime"

[[processors.regex]]
  # Basename ohne .csv -> trip
  [[processors.regex.tags]]
    key = "path"
    pattern = '''^.*[\\/](?P<file>[^\\/]+)\.csv$'''
    replacement = "${file}"
    result_key = "trip"


[[processors.starlark]]
  source = '''
load("time.star", "time")

def apply(metric):
    path = metric.tags.get("path")
    t = metric.fields.get("recordtime")
    
    # recordtime entfernen
    if t != None:
        metric.fields.pop("recordtime")
    
    if path == None or t == None:
        return metric
    
    # Datum aus Pfad extrahieren (YYYY-MM-DD)
    path_str = str(path)
    date_start = -1
    
    for i in range(len(path_str) - 9):
        if (path_str[i:i+1].isdigit() and 
            path_str[i+1:i+2].isdigit() and 
            path_str[i+2:i+3].isdigit() and 
            path_str[i+3:i+4].isdigit() and 
            path_str[i+4:i+5] == "-" and
            path_str[i+5:i+6].isdigit() and 
            path_str[i+6:i+7].isdigit() and 
            path_str[i+7:i+8] == "-" and
            path_str[i+8:i+9].isdigit() and 
            path_str[i+9:i+10].isdigit()):
            date_start = i
            break
    
    if date_start == -1:
        return metric
    
    fd = path_str[date_start:date_start+10]
    
    # Zeit bereinigen
    t_str = str(t).strip().strip('"').strip("'")
    ts_str = fd + " " + t_str
    
    # Layouts
    layout_ms = "2006-01-02 15:04:05.000"
    layout_s  = "2006-01-02 15:04:05"
    
    # Mit Millisekunden
    if "." in t_str:
        result = time.parse_time(ts_str, layout_ms, "Europe/Berlin")
        if result != None:
            metric.time = result.unix_nano
            return metric
    
    # Ohne Millisekunden
    result = time.parse_time(ts_str, layout_s, "Europe/Berlin")
    if result != None:
        metric.time = result.unix_nano
    
    return metric
'''

# Cleanup - path Tag entfernen
[[processors.starlark]]
  source = '''
def apply(metric):
    # Entferne path Tag
    metric.tags.pop("path", None)
    return metric
'''

[[processors.starlark]]
  source = '''
# Alles (bis auf SKIP_FIELDS) wird hart zu float gecastet.
SKIP_FIELDS = ["recordtime"]

def apply(metric):
    for k in list(metric.fields.keys()):
        if k in SKIP_FIELDS:
            continue

        v = metric.fields.get(k)
        if v == None:
            metric.fields.pop(k, None)
            continue

        s = str(v).strip().strip('"').strip("'")

        # offensichtliche Platzhalter droppen
        sl = s.lower()
        if s == "" or sl == "nan" or sl == "null" or s == "-" or s == ".":
            metric.fields.pop(k, None)
            continue

        # Dezimal-Komma -> Punkt (falls kein Punkt vorhanden)
        if s.find(",") != -1 and s.find(".") == -1:
            s = s.replace(",", ".")

        # harter Float-Cast
        metric.fields[k] = float(s)

    return [metric]
'''



# ============================
# OUTPUT: INFLUXDB V2
# ============================
[[outputs.influxdb_v2]]
  urls         = ["<YourInfluxDbUrl>:8086/"]
  token        = "<YourApiToken>"
  organization = "<YourOrganization>"
  bucket       = "carscanner_tagged"
